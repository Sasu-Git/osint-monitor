[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-monitor"
version = "2.0.0"
description = "Autonomous geopolitical intelligence collection and analysis platform"
requires-python = ">=3.10"
dependencies = [
    # Core
    "feedparser>=6.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # NLP
    "spacy>=3.7",
    "rapidfuzz>=3.0",
    # Embeddings & Clustering
    "sentence-transformers>=2.2",
    "hdbscan>=0.8",
    "numpy>=1.24",
    # LLM Providers
    "openai>=1.0",
    "python-dotenv>=1.0",       # imported by the OpenAI provider
    # Geocoding (default pipeline stage)
    "geopy>=2.4",
    # Analysis
    "scipy>=1.11",
    "networkx>=3.0",
    # API & Web
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    # Alerting
    "apscheduler>=3.10",
    # Scraping
    "lxml>=5.0",
]

[project.optional-dependencies]
telegram = ["telethon>=1.34"]
twitter = ["tweepy>=4.14"]
anthropic = ["anthropic>=0.25"]
gemini = ["google-genai>=1.0"]
desktop = ["plyer>=2.1"]
geo = ["mgrs>=1.4"]                     # MGRS grid references in geocoding
postgres = ["psycopg2-binary>=2.9", "pgvector>=0.2"]
celery = ["celery[redis]>=5.3"]
# Not part of `all`: only used by on-demand document / image analysis and the
# browser collector, and heavy (OCR models) or needing external binaries.
documents = ["pymupdf>=1.24", "pdfplumber>=0.11", "PyPDF2>=3.0", "python-docx>=1.1", "openpyxl>=3.1"]
imint = ["Pillow>=10.0", "easyocr>=1.7", "pytesseract>=0.3"]   # pytesseract needs the tesseract binary
browser = ["playwright>=1.45"]          # then: python -m playwright install chromium
# Everything collect / briefing / serve / daemon can use.
all = [
    "telethon>=1.34",
    "tweepy>=4.14",
    "anthropic>=0.25",
    "google-genai>=1.0",
    "plyer>=2.1",
    "mgrs>=1.4",
    "psycopg2-binary>=2.9",
    "pgvector>=0.2",
    "celery[redis]>=5.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
osint-monitor = "osint_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["osint_monitor*"]
