# Frozen gold set for entity detection, typing, canonical resolution, actor roles and principal actors.
#
# Items: the 25 Developments (87 items) of evaluations/entities/entity-review-2026-09-30.md; text = each item's
# headline and lead sentence as stored in items.json (principals._lead), after the benchmark's own reading of it.
#
# Labelled 2026-09-30 by Claude from the item text and the "Core Entity Resolution Principle & Enforcement Rules"
# specification only, before any code change and without looking at model output for these items. The owner's
# review fields in the review document were left empty; these labels stand in for them and are frozen (sha256 in
# manifest.yaml). Contestable calls are marked in comments.
#
# Entity entries per item: one string, entries separated by "; ", each "surface | TYPE | canonical". TYPE may list alternatives ("ORG/NORP"). "? " marks an optional
# mention: detecting it or not is neither a hit nor an error. Types: PERSON, NORP, GPE (countries, cities, regions),
# LOC (non-political places), FAC, ORG, EVENT, PRODUCT, LAW.
# roles: canonical -> actor | participant | target | affected | institutional_context | subject | location.
# principals: the Development's principal actors = the entities whose role is actor; "A|B" accepts either name
# (a head of state/government speaking for the state).
# Accepted names exclude bare generic labels (Navy, Council, Commission, Air Force, Supreme Court, General Assembly):
# the spec forbids them as standalone canonical identities (amended 2026-09-30 before the first benchmark run).

