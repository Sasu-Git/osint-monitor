# E1 action lexicon (EXPERIMENT-PLAN.md, amendment 1). FROZEN before any measurement: do not edit.
# General classes only: no names, places or case identifiers. Keys are lowercase spaCy lemmas (verbs and event nouns).
# A lemma belongs to at most one class per language. Lemmas outside the lexicon, and the generic list, never fire.
version: 1
generic:
  en: [say, report, update, continue, make, take, hold]
  es: [decir, informar, actualizar, continuar, seguir, hacer, tomar, mantener]
  it: [dire, riferire, aggiornare, continuare, fare, prendere, tenere]
