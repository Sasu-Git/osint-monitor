{# HIGH / NORMAL / LOW / MUTED control for one country or topic; posts its stable id. #}
{% macro levels_control(scope, key, current, label) -%}
  <div class="lvl-seg" role="group" aria-label="Priority for {{ label }}">
    {% for lv in levels %}
    <button type="button" class="lv lv-{{ lv }}" {% if lv == current %}aria-pressed="true"{% else %}aria-pressed="false"{% endif %}
            hx-post="/ui/priorities/{{ scope }}/{{ key }}" hx-vals='{"level": "{{ lv }}"}'
            hx-target="#priorities" hx-swap="outerHTML" title="{{ lv | capitalize }}">{{ lv[0] }}</button>
    {% endfor %}
  </div>
{%- endmacro %}
