# Actor normalisation: how entity mentions become canonical actors.
# Read by osint_monitor.processors.actors.ActorNormalizer and used by principal-actor
# extraction, situation grouping and ranking topic keys.
#
# Order applied to every mention:
#   1. surface cleanup (quotes, trailing punctuation, possessive "'s")
#   2. the entity resolver's normalisation (lowercase, articles, US/U.S./America -> united states, ...)
#   3. non_actors   -> dropped (topics the NER mislabels as organisations or places)
#   4. demonyms     -> country ("Aussie" -> Australia); plurals ("Russians") are handled
#   5. aliases      -> canonical actor ("Kremlin" -> Russia); then the place names of config/geography.yaml
#                      in other languages ("Estados Unidos", "Stati Uniti", "Moscú") for mentions that are not
#                      already actor names. Demonym and alias lookups are also accent-insensitive.
#   6. represents   -> the state a person or body acts for ("Xi" -> China); situations and
#                      principal support are counted at this level
# All matching is on the normalised (lowercase) form; entries are case-insensitive.

non_actors:
  - AI
  - A.I.
  - artificial intelligence
  - GenAI
  - Internet
  - Bitcoin
  - Crypto
  - Covid
  - COVID-19
  - Brexit
  - Location
  - Magnitude

