# Bare names that stand for several people (a family name shared by politicians). Such a mention is not an
# actor on its own: "Bolsonaro" may be Jair (former president) or Flávio / Eduardo (his sons, politicians), and
# merging them would fuse different principals. Full names ("Flávio Bolsonaro") remain actors.
ambiguous_names: [Bolsonaro]

# Role prefixes dropped from a name before matching ("FM Araghchi" -> Araghchi). Only
# applied when the full name is not itself a configured actor.
titles: [FM, PM, President, Prime Minister, Foreign Minister, Defence Minister, Defense Minister,
         Minister, Chancellor, King, Queen, Crown Prince, Prince, Sheikh, General, Gen, Gen.,
         Lt, Col, Dr, Mr, Mrs, Ms, Prof, Senator, Sen, Governor, Mayor]

# News outlets. When one only reports ("tells BBC", "BBC reports from", "according to CCTV")
# it is not a principal of the development; as the subject of anything else it still is.
media_outlets: [BBC, BBC World, CCTV, CNN, Al Jazeera, Reuters, AP, Associated Press, AFP, Bloomberg,
                Xinhua, TASS, IRNA, KCNA, Yonhap, Kyodo, NHK, Fox News, Sky News, New York Times,
                Washington Post, Wall Street Journal, Financial Times, Guardian, South China Morning Post,
                SCMP, Defense News, Breaking Defense, Global Times, RT, Anadolu,
                ANSA, EFE, Europa Press, Rai, RaiNews, Deutsche Welle, DW, France 24, El País,
                Il Sole 24 Ore, Clarín, Kyiv Independent]
