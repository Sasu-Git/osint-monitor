# Person / body -> the state it acts for. Situations are country-level, so "Xi met Trump"
# involves China and the United States. Keep to principals who reliably act for a state;
# a bare "Air Force" or "Navy" names no state and stays an organisation.
represents:
  # capitals and seats of government act for their state ("Tallinn accuses Moscow"); they remain places
  # with their own identity -- this is the actor mapping, not an alias (config/institutions.yaml holds bodies)
