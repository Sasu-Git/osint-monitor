# OSINT Sources Configuration
# Updated: 2026-03-19

# Tiered polling intervals (seconds)
# Hot:  pre-narrative signals (ADS-B, DNS, currency, commodities, defense stocks, seismic)
# Warm: news and social (RSS, Nitter, travel advisories, OONI, flight routes, GDELT, cables, BGP)
# Cold: slow-updating datasets (FIRMS, USGS, ACLED, sanctions, NVD, UNHCR, IAEA, SEC, finance)
tiers:
  hot_interval_seconds: 150    # 2.5 min
  warm_interval_seconds: 600   # 10 min
  cold_interval_seconds: 3600  # 60 min
  # Wall-clock budget per collect() call (seconds), by collector class. A collector past its
  # budget stops between targets and returns partial results, logged as "stopped early".
  # Keep hot-tier budgets well under hot_interval_seconds.
  collector_budgets:
    DNSHealthMonitor: 90       # observed 83 s for all domains
    BGPMonitor: 180            # observed 164 s; runs in the warm tier (600 s)

# RSS Feeds - these work without API keys.
# Per feed: `identity` is the organisation (several feeds may share one; default: the feed name),
# `language` the ISO 639-1 language of the content (stored as published, never translated),
# `category` the source class (provenance role via config/provenance.yaml category_roles, or an
# explicit entry there), `enabled: false` + `access` for feeds that need a licence or are unreachable.
# Every feed is an endpoint in `python main.py inspect sources`. All RSS feeds run in the warm tier.
rss_feeds:
