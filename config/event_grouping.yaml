# How collected items are grouped into events. Read by osint_monitor.processors.event_grouping.
#
# Narrative items (news, statements, analysis) are clustered semantically on their text.
# Structured items (sensor readings and machine-generated records) are templated: two
# unrelated earthquakes read almost alike, so they are grouped by record identity instead
# -- never by text similarity. Both paths produce the same Event objects downstream.
#
# A source is structured when its type or its name is listed below; anything else is
# narrative, so new news sources need no entry. `narrative_sources` overrides a type.

structured:
  source_types:
    - infrastructure        # DNS, BGP, OONI, seismic explosion detector
    - adsb
    - ais
    - aviation              # NOTAMs
    - financial
    - spectrum              # submarine cables
    - sanctions
    - sigint_vuln
    - sigint_econ
    - sigint_displacement
    - sigint_nuclear
    - sigint_imint
    - sigint_trade
  sources:
    - USGS Seismic          # type structured_api, shared with prose feeds below
    - NASA FIRMS
    - Travel Advisories     # type government, but one templated record per country

narrative_sources:
  - GDELT                   # structured_api, but items are news articles
  - ACLED                   # event records with analyst notes

# Structured strategy per source. Sources not listed are "standalone": each record is its
# own observation and is never merged with another (ADS-B snapshots, DNS/BGP checks,
# sanctions listings, CVEs). Standalone records stay available to fusion and I&W.
strategies:
  USGS Seismic: seismic
  Seismic Explosion Detector: seismic

seismic:
  # Same earthquake: the same USGS event id, or -- when ids differ between catalogues --
  # origin times, epicentres and magnitudes all close.
  max_seconds_apart: 120
  max_km_apart: 100
  max_magnitude_difference: 0.5

# Narrative clusters group reports about one story; a story holds several Developments (an
# action, the reaction, the next day's action, analysis of it). Segmentation re-checks every
# link inside a cluster and drops links between items that cannot be one Development; the
# cluster becomes the connected components of the rest. Analysis items cut off this way are
# kept as commentary on the Development they discuss. Evidence and settings:
# evaluations/clustering/development-identity-diagnosis.md; enabled after the blind live
# validation in evaluations/clustering/segmentation-compatibility.md (set false to turn it off).
development_segmentation:
  enabled: true
  analysis_headlines: true        # "Why ...?", "What we know ...", explainers vs report headlines
  min_headline_similarity: 0.5    # two outlets' headlines below this cosine are different Developments
  disjoint_locations: true        # both items name places and none is compatible
  location_match: containment     # compare places through config/geography.yaml ("northern cyprus" is in "cyprus");
                                  # "exact" compares names only
  use_regions: false              # supra-national regions ("middle east") do not make places compatible
  headline_override:              # a headline mismatch alone does not split two report headlines that were
    max_hours: 6                  # published within 6 h and name compatible places (one storm headlined
    require_shared_place: true    # by region and by states); never applies to live blogs or analysis
    min_shared_actors: 0
  occurrence_match:               # owner rule P7: a headline mismatch between two report headlines is one
    max_hours: 24                 # occurrence only on explicit evidence: within 24 h, no place conflict, and a
    min_shared_anchors: 1         # specific named entity in common (not a state, a leader, an outlet or a
    use_cited_source: true        # generic label) or the same cited source

# Lexical identity evidence (osint_monitor/processors/lexical.py). Production has one lexical link
# rule: two items from the same outlet link only when their headlines are near-identical (story
# updates); cross-source links are decided by embedding similarity. The term classes below explain
# pairs (diagnostics, benchmark audit) and do not change links. Evidence:
# evaluations/clustering/lexical-identity.md.
lexical:
  same_source_title_ratio: 90       # rapidfuzz ratio of the two lower-cased headlines
  generic_document_frequency: 0.05  # a content word in >= 5% of the batch says little about which occurrence
  min_documents_for_frequency: 30   # smaller batches classify words with generic_terms only
  generic_terms: [said, says, told, report, reports, reported, according, news, latest, update, new, today, week, year]
  class_weights: {high: 1.0, medium: 0.5, generic: 0.1}   # diagnostic overlap only
  guard:
    enabled: false                  # candidate link rule, see the evaluation note

# Cross-language Development links (processors/cross_language.py; owner decision 2026-10-07). A multilingual model
# proposes links between narrative units that share no language (centroid cosine >= min_cosine, first reports at most
# max_hours apart); a link is accepted only on explicit anchors -- a shared specific named entity, a compatible specific
# (non-country) place, or a shared non-year number -- and no place conflict. Cosine alone never merges. Off until it
# is benchmarked on identity gold revision 3.
cross_language:
  enabled: false
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  min_cosine: 0.60
  max_hours: 24
  # Acceptance guard (evaluations/identity/xlang-guard-tuning-plan.md). These values are the original stage.
  require_anchor_classes: 1     # G1: distinct anchor classes (actor, place, number) a pair must share
  broad_anchor_units: null      # G2: an anchor or place in more than this many units of the run is not decisive
  direct_links_only: false      # G3: units merge only through direct links, never through a chain
  exact_places: false           # G4: a place anchor needs the same place; containment does not count
