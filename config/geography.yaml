# Place containment for geographic compatibility (osint_monitor/processors/geography.py).
#
# Two place mentions are compatible when they name the same place or one contains the other
# ("Northern Cyprus" and "Cyprus", "California" and "United States"). Two places inside the same
# country are NOT compatible by that fact alone: Kyiv and Odesa are different places. Names not
# listed here only match themselves. Keys and values are lower-case; lookups normalise names
# (HTML entities, possessives, "the").
#
# `places` maps a place to the place that contains it. Countries need no entry unless they sit
# inside a region below. `regions` are supra-national areas, applied only when
# `use_regions` is enabled by the caller.

